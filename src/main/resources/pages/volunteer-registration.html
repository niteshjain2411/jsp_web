<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration - Jain Sangh Pune | JSP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --primary-color: #2a7d8c;
            --secondary-color: #f4b41a;
            --text-dark: #333;
            --light-bg: #fdfdfd;
            --border-color: #e0e0e0;
            --disabled-color: #cccccc;
        }

        body { font-family: 'Open Sans', sans-serif; margin: 0; padding: 0; color: var(--text-dark); background-color: #fff; }

        .back-link { display: inline-block; margin: 20px 5%; color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }

        .content { padding: 40px 5%; max-width: 900px; margin: 0 auto; }

        h1 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-color);
            font-size: 2.2rem;
            border-left: 5px solid var(--secondary-color);
            padding-left: 15px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .content-text { line-height: 1.8; font-size: 1.05rem; color: #555; }

        .registration-form {
            background: var(--light-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
            font-family: 'Montserrat', sans-serif;
        }

        input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            box-sizing: border-box;
        }

        input[type="select"], input[type="gender"], input[type="select"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            box-sizing: border-box;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            color: #555;
        }

        .checkbox-item input { margin-right: 10px; accent-color: var(--primary-color); }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
            width: 100%;
        }

        .submit-btn:disabled {
            background: var(--disabled-color);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .submit-btn:hover:not(:disabled) { background: #1e5a65; }

        /* FIXED: Added explicit styling to keep success message hidden initially */
        .success-message {
            display: none;
            background-color: #e6f4ea;
            border: 1px solid #34a853;
            color: #137333;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            text-align: center;
        }

        footer { background: #222; color: #bbb; padding: 40px 5% 20px; font-size: 0.9rem; margin-top: 60px; }
    </style>
</head>
<body>

<script src="header-loader.js"></script>
<script src="footer-loader.js"></script>

<div id="header-placeholder"></div>
<a href="home.html" class="back-link">← Back to Home</a>

<main class="content">
    <h1>Volunteer Registration</h1>
    <div class="content-text">
        <p>Please fill out the form below. Fields marked with an asterisk (*) are required.</p>

        <form class="registration-form" id="volunteerForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your 10-digit mobile number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter your city">
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="120" step="1">
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select Initiatives to Support:</label>
                <div class="activities-grid">
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="मंदिर निर्माण"> 🛕 मंदिर निर्माण</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="संत निवास निर्माण"> 🏠 संत निवास निर्माण</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="आनंदशाला"> 🎮 आनंदशाला</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="संस्कार शिविर"> 📖 संस्कार शिविर</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="सराक उत्थान"> 🤝 सराक उत्थान</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="तीर्थ यात्रा"> 👣 तीर्थ यात्रा</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="धर्मार्थ औषधालय"> ⚕️ धर्मार्थ औषधालय</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="जीर्णोद्धार"> 🛠️ जीर्णोद्धार</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="छात्रवृत्ति"> 🎓 छात्रवृत्ति</label>
                    <label class="checkbox-item"><input type="checkbox" name="selectedActivities" value="सामाजिक कार्य"> 🌍 सामाजिक कार्य</label>
                </div>
            </div>

            <div class="form-group">
                <label for="professionSkills">Skills / Professional Expertise</label>
                <textarea id="professionSkills" name="professionSkills" rows="3" placeholder="e.g. IT, Accounting, Healthcare..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>Register as Volunteer</button>
        </form>
    </div>

    <div id="successMessage" class="success-message">
        <h2>✓ Registration Successful!</h2>
        <p>Thank you for registering</p>
    </div>
</main>

<div id="footer-placeholder"></div>

<script>
    const form = document.getElementById('volunteerForm');
    const nameInput = document.getElementById('name');
    const phoneInput = document.getElementById('phone');
    const submitBtn = document.getElementById('submitBtn');
    const successMsg = document.getElementById('successMessage');

    // FIXED: Ensure message is hidden and form is reset cleanly on page reload
    window.addEventListener('DOMContentLoaded', () => {
        successMsg.style.display = 'none';
        form.reset();
        validateForm();
    });

    function validateForm() {
        const isNameFilled = nameInput.value.trim() !== "";
        const isPhoneFilled = phoneInput.value.trim() !== "";
        submitBtn.disabled = !(isNameFilled && isPhoneFilled);
    }

    nameInput.addEventListener('input', validateForm);
    phoneInput.addEventListener('input', validateForm);

    function handleSubmit(event) {
        event.preventDefault();

        const activitiesCheckBoxes = document.querySelectorAll("input[name='selectedActivities']:checked");
        const selectedActivities = Array.from(activitiesCheckBoxes).map(cb => cb.value);

        const registrationData = {
            fullName: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            city: document.getElementById("city").value,
            age: document.getElementById("age").value,
            gender: document.getElementById("gender").value,
            professionSkills: document.getElementById("professionSkills").value,
            selectedActivities: selectedActivities
        };

        fetch('/jainsanghpune/api/registration/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(registrationData)
        })
        .then(response => response.json())
        .then(data => {
            // Hide the form upon successful collection
            form.style.display = "none";

            // Show success message
            successMsg.style.display = "block";
            successMsg.scrollIntoView({ behavior: "smooth" });
        })
        .catch((error) => {
            console.error('Error:', error);
            alert('Error submitting registration. Please try again.');
        });
    }
</script>

</body>
</html>
