<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSP Header Component - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-teal: #1d6473;
            --primary-glow: #2a7d8c;
            --accent-gold: #f4b41a;
            --logo-red: #c62817;
            --text-dark: #222222;
            --text-muted: #666666;
            --light-bg: #f9fbfb;
            --border-color: #eef2f3;
            --shadow-premium: 0 10px 30px rgba(0, 0, 0, 0.06);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background: linear-gradient(to right, var(--accent-gold) 0, var(--accent-gold) 100%) top/100% 6px no-repeat,
                        rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 22px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-premium);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo-img {
            height: 82px;
            width: auto;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
            transition: var(--transition-smooth);
        }

        .logo-container:hover .logo-img {
            transform: scale(1.03) rotate(1deg);
        }

        .logo-text-block {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .logo-main-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: var(--logo-red);
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .header-tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e67e22;
            font-style: italic;
            margin: 6px 0 0 2px;
            letter-spacing: 0.5px;
            display: block;
            animation: softGlow 3s infinite alternate;
            text-align: left;
        }

        @keyframes softGlow {
            0% { opacity: 0.85; text-shadow: 0 0 0px rgba(230,126,34,0); }
            100% { opacity: 1; text-shadow: 0 0 8px rgba(230,126,34,0.15); }
        }

        .nav-container {
            display: flex;
            align-items: center;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav > a:not(.donate-btn):not(.join-us-btn),
        .nav-item > a {
            margin-left: 24px;
            text-decoration: none;
            color: var(--primary-teal);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            padding: 10px 0;
            position: relative;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
        }

        nav > a:not(.donate-btn):not(.join-us-btn):hover,
        .nav-item:hover > a {
            color: var(--logo-red);
        }

        nav > a:not(.donate-btn):not(.join-us-btn)::after,
        .nav-item > a::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 0;
            height: 3px;
            background-color: var(--logo-red);
            border-radius: 4px;
            transition: var(--transition-smooth);
        }

        nav > a:not(.donate-btn):not(.join-us-btn):hover::after,
        .nav-item:hover > a::after {
            width: 100%;
        }

        .nav-item {
            position: relative;
        }

        .nav-item > a .caret {
            margin-left: 6px;
            font-size: 0.75rem;
            transition: transform 0.25s ease;
        }

        .nav-item:hover > a .caret {
            transform: rotate(180deg);
            color: var(--logo-red);
        }

        /* Modern Dropdown Menu Grid Design - UPDATED FOR REDUCED WIDTH */
        .nav-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #ffffff;
            border-radius: 12px;
            min-width: 240px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--border-color);
            z-index: 1010;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            transform: translateY(15px);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-smooth);
            pointer-events: none;
        }

        .nav-item:hover .nav-dropdown {
            transform: translateY(4px);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .nav-dropdown a {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: var(--transition-smooth);
        }

        .nav-dropdown a::after { display: none !important; }

        .nav-dropdown a .dropdown-icon {
            margin-right: 12px;
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .nav-dropdown a:hover {
            background: var(--light-bg);
            color: var(--primary-glow);
            padding-left: 18px;
        }

        .donate-btn {
            background: linear-gradient(135deg, var(--logo-red) 0%, #a3190c 100%);
            color: #ffffff !important;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            padding: 11px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(198, 40, 23, 0.25);
            margin-left: 25px;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .donate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(198, 40, 23, 0.35);
            background: linear-gradient(135deg, #a3190c 0%, #821005 100%);
        }

        .join-us-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: transparent;
            color: var(--primary-teal) !important;
            border: 2px solid var(--primary-teal);
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            padding: 9px 22px;
            border-radius: 30px;
            margin-left: 15px;
            text-decoration: none;
            height: 40px;
            box-sizing: border-box;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .join-us-btn i {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .join-us-btn:hover {
            color: #ffffff !important;
            background-color: var(--primary-teal);
            box-shadow: 0 4px 15px rgba(29, 100, 115, 0.25);
            transform: translateY(-2px);
        }

        .join-us-btn:hover i {
            transform: translateX(3px) scale(1.1);
        }

        .mobile-menu-checkbox {
            display: none;
        }

        .mobile-menu-btn {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            z-index: 1050;
        }

        .mobile-menu-btn span {
            display: block;
            width: 26px;
            height: 3px;
            background-color: var(--primary-teal);
            border-radius: 2px;
            transition: var(--transition-smooth);
        }

        @media (max-width: 1024px) {
            header { padding: 15px 4%; }
            .logo-main-title { font-size: 1.6rem; }
            .logo-img { height: 72px; }
            .header-tagline { font-size: 0.85rem; }
            nav > a:not(.donate-btn):not(.join-us-btn), .nav-item > a { margin-left: 14px; font-size: 0.85rem; }
            .donate-btn { margin-left: 15px; padding: 10px 18px; }
            .join-us-btn { margin-left: 10px; padding: 8px 18px; }
        }

        @media (max-width: 868px) {
            header { padding: 12px 4%; }
            .logo-img { height: 65px; }
            .logo-main-title { font-size: 1.4rem; }
            .header-tagline { font-size: 0.8rem; margin-top: 3px; }
            .mobile-menu-btn { display: flex; }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 290px;
                height: 100vh;
                background: #ffffff;
                box-shadow: -10px 0 30px rgba(0,0,0,0.08);
                flex-direction: column;
                align-items: flex-start;
                padding: 100px 30px 40px 30px;
                box-sizing: border-box;
                transition: var(--transition-smooth);
                overflow-y: auto;
                z-index: 1040;
            }

            nav > a:not(.donate-btn):not(.join-us-btn), .nav-item {
                width: 100%;
                margin-left: 0;
                margin-bottom: 15px;
            }

            nav > a:not(.donate-btn):not(.join-us-btn), .nav-item > a {
                font-size: 1.05rem;
                width: 100%;
                padding: 12px 0;
                border-bottom: 1px solid var(--border-color);
            }

            nav > a:not(.donate-btn):not(.join-us-btn)::after, .nav-item > a::after {
                display: none;
            }

            .nav-item:hover .nav-dropdown {
                position: relative;
                top: 0;
                right: 0;
                transform: none;
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                box-shadow: none;
                border: none;
                min-width: 100%;
                padding-left: 15px;
                background-color: var(--light-bg);
            }

            .donate-btn { margin-left: 0; margin-top: 15px; width: 100%; text-align: center; box-sizing: border-box; }
            .join-us-btn { margin-left: 0; margin-top: 15px; width: 100%; justify-content: center; }
            .mobile-menu-checkbox:checked ~ nav { right: 0; }
            .mobile-menu-checkbox:checked ~ .mobile-menu-btn span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
            .mobile-menu-checkbox:checked ~ .mobile-menu-btn span:nth-child(2) { opacity: 0; }
            .mobile-menu-checkbox:checked ~ .mobile-menu-btn span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
        }
    </style>
</head>
<body>

<header>

        <nav>

                    <a href="saraak.html"><span class="dropdown-icon">🤝</span> सराक उत्थान</a>
                    <a href="teerth_yatra.html"><span class="dropdown-icon">👣</span> तीर्थ यात्रा</a>
                    <a href="ausdhalaya.html"><span class="dropdown-icon">⚕️</span> धर्मार्थ औषधालय</a>
                    <a href="jirnodhar.html"><span class="dropdown-icon">🛠️</span> प्राचीन जीर्णोद्धार</a>
                    <a href="scholarship.html"><span class="dropdown-icon">🎓</span> छात्रवृत्ति सम्मान</a>

            <a href="donate-now.html" class="donate-btn">Donate Now</a>
            <a href="volunteer-registration.html" class="join-us-btn">
                Join Us <i class="fas fa-arrow-right"></i>
            </a>
        </nav>
    </div>
</header>

</body>
</html>
