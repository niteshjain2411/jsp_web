<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Console - Candidate Search | JSP</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght=400;500;600;700&family=Open+Sans:wght=400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Re-engineered Color Palette matching manage-profile theme */
        :root {
            --primary-blue: #0284c7;
            /* Vibrant Sky Blue */
            --secondary-blue: #0369a1;
            /* Deep Sky Blue */
            --dark-navy: #0f172a;
            /* Professional Background Navy */
            --accent-cyan: #06b6d4;
            /* Energetic Motivation Highlight */
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --light-bg: #f0f9ff;
            /* Soft Sky Tint */
            --card-shadow: 0 10px 30px rgba(2, 132, 199, 0.08);
            --border-color: #cbd5e1;
            --focus-ring: rgba(2, 132, 199, 0.2);
            --success-green: #22c55e;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 25%, #dcf0fa 50%, #bae6fd 75%, #7dd3fc 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 30px 5% 10px 5%;
            color: var(--secondary-blue);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-cyan);
            transform: translateX(-3px);
        }

        .content {
            padding: 10px 5% 80px 5%;
            max-width: 1100px;
            margin: 0 auto;
            box-sizing: border-box;
            flex: 1;
            width: 100%;
        }

        /* Recruiter Hero Banner */
        .compact-hero {
            background: linear-gradient(135deg, var(--dark-navy) 0%, var(--secondary-blue) 100%);
            color: #ffffff;
            padding: 40px;
            border-radius: 12px 12px 0 0;
            margin-bottom: 0;
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        .compact-hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: rgba(6, 182, 212, 0.2);
            filter: blur(80px);
            border-radius: 50%;
        }

        .compact-hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            margin: 0 0 12px 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        .compact-hero p {
            font-size: 15px;
            margin: 0;
            opacity: 0.9;
            line-height: 1.6;
            max-width: 750px;
        }

        .main-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .card-body-padding {
            padding: 45px;
        }

        /* Filter Console Layout */
        .filter-section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--secondary-blue);
            font-size: 18px;
            margin: 0 0 20px 0;
            border-left: 5px solid var(--accent-cyan);
            padding-left: 14px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group.full-width {
            grid-column: span 3;
        }

        label {
            font-weight: 600;
            font-size: 13.5px;
            color: #334155;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-dark);
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        /* Action Buttons */
        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--secondary-blue) 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--secondary-blue) 0%, #025a87) 100%;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--text-dark);
        }

        /* Enclosing Result Section Panel Wrapper (Hidden Initially) */
        #resultsSection {
            display: none;
            animation: fadeIn 0.4s ease-out;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Candidates List Framework Result Section Elements */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 20px 0;
        }

        .results-count {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .results-count strong {
            color: var(--secondary-blue);
        }

        .candidate-cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .candidate-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.25s ease;
            position: relative;
            animation: slideUp 0.5s ease-out both;
        }

        .candidate-card:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.05);
            transform: translateY(-2px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .candidate-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--dark-navy);
            margin: 0 0 6px 0;
        }

        .candidate-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .candidate-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .candidate-meta i {
            color: var(--primary-blue);
        }

        /* Notice Period Pill Badges */
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-immediate {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-days {
            background-color: #fef9c3;
            color: #a16207;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }

        .skill-tag {
            background: var(--light-bg);
            color: var(--secondary-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12.5px;
            font-weight: 600;
            border: 1px solid #bae6fd;
        }

        .candidate-summary {
            font-size: 14px;
            color: #475569;
            margin: 12px 0 0 0;
            line-height: 1.6;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 3px solid #cbd5e1;
        }

        .download-resume-btn {
            background: none;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 8px 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 15px;
        }

        .download-resume-btn:hover {
            background: var(--primary-blue);
            color: #ffffff;
        }

        /* Status notification panel states */
        .status-notification {
            display: none;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            font-family: 'Open Sans', sans-serif;
        }

        .status-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .status-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        /* No records style frame wrapper */
        .empty-results-box {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            background: #f8fafc;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .empty-results-box i {
            font-size: 40px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <script src="../header-loader.js"></script>
    <script src="../footer-loader.js"></script>
    <div id="header-placeholder"></div>

    <a href="job-portal.html" class="back-link"><i class="fas fa-arrow-left"></i>Back to Portal Dashboard</a>

    <div class="content">

        <div id="statusAlert" class="status-notification"></div>

        <div class="main-card">
            <div class="compact-hero">
                <h1>🔍 Search Your Candidates</h1>
                <p>Refine and drill down into candidate parameters across experience profiles, technical core
                    competencies, and availability matrices to scale your engineering teams.</p>
            </div>

            <div class="card-body-padding">
                <form id="filterForm" onsubmit="executeSearch(event)">
                    <div class="filter-section-title">Filter Candidates Index</div>

                    <div class="filter-grid">
                        <div class="filter-group full-width">
                            <label for="searchSkills">Search Technologies / Core Skills</label>
                            <input type="text" id="searchSkills"
                                placeholder="e.g. Java, React, Node.js, Python, Sales, Finance">
                        </div>

                        <div class="filter-group">
                            <label for="filterQualification">Academic Qualification</label>
                            <select id="filterQualification">
                                <option value="">All Qualifications</option>
                                <option value="Graduate - Non Tech">Graduate (B.A., B.Com, B.Sc)</option>
                                <option value="Graduate - Tech">Technical Graduate (B.E., B.Tech, BCA)</option>
                                <option value="Post Graduate">Post Graduate (M.Sc, MBA)</option>
                                <option value="Post Graduate - Tech">Technical Post Graduate (M.Tech, MCA)</option>
                                <option value="Doctorate">Doctorate / Professional</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="filterExperience">Total Work Experience</label>
                            <select id="filterExperience">
                                <option value="">All Experience Ranges</option>
                                <option value="Fresher">Fresher / Entry Track</option>
                                <option value="1-2 Years">1 - 2 Years</option>
                                <option value="3-5 Years">3 - 5 Years</option>
                                <option value="6-10 Years">6 - 10 Years</option>
                                <option value="10+ Years">10+ Years Executive Track</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label for="filterNotice">Availability / Notice Period</label>
                            <select id="filterNotice">
                                <option value="">All Availabilities</option>
                                <option value="Immediate">Immediate / Serving</option>
                                <option value="15 Days">15 Days</option>
                                <option value="30 Days">30 Days</option>
                                <option value="60 Days">60 Days</option>
                                <option value="90 Days">90 Days</option>
                            </select>
                        </div>

                        <div class="filter-group full-width">
                            <label for="searchLocation">Preferred Placement City / Location Target</label>
                            <input type="text" id="searchLocation" placeholder="e.g. Pune, Mumbai, Bangalore">
                        </div>
                    </div>

                    <div class="action-row">
                        <button type="button" class="btn btn-secondary" onclick="resetFilters()"><i
                                class="fas fa-undo"></i> Reset Filters
                        </button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-filter"></i> Evaluate
                            Profiles
                        </button>
                    </div>
                </form>

                <div id="resultsSection">
                    <div class="results-header">
                        <div class="results-count">Showing <strong id="visibleCount">0</strong> active talent pools
                            matching evaluation records
                        </div>
                    </div>

                    <div id="candidateResultsWrapper" class="candidate-cards-container">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        function executeSearch(event) {
            event.preventDefault();

            // Harvest criteria inputs from form variables
            const skills = document.getElementById('searchSkills').value.trim();
            const qualification = document.getElementById('filterQualification').value;
            const experience = document.getElementById('filterExperience').value;
            const noticePeriod = document.getElementById('filterNotice').value;
            const city = document.getElementById('searchLocation').value.trim();

            // Build key criteria parameters context mapping maps
            const payloadParams = {};
            if (skills) payloadParams.skills = skills;
            if (qualification) payloadParams.qualification = qualification;
            if (experience) payloadParams.experience = experience;
            if (noticePeriod) payloadParams.noticePeriod = noticePeriod;
            if (city) payloadParams.city = city;

            loadCandidateRegistry(payloadParams);
        }


        function loadCandidateRegistry(params) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsWrapper = document.getElementById('candidateResultsWrapper');

            // Dynamic visibility execution step: Reveal container to display inline network loaders
            resultsSection.style.display = 'block';
            resultsWrapper.innerHTML = `
    <div class="empty-results-box">
        <i class="fas fa-spinner fa-spin" style="color: var(--primary-blue);"></i>
        <p>Retrieving matching profiles...</p>
    </div>
`;

            // Parse object rules parameters into URI encoding strings maps
            const queryString = new URLSearchParams(params).toString();
            const requestUrl = window.location.pathname.includes('/jainsanghpune/') ?
                `/jainsanghpune/api/job-portal/searchCandidates${queryString ? '?' + queryString : ''}`
                : `/api/job-portal/searchCandidates${queryString ? '?' + queryString : ''}`;

            fetch(requestUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            })
                .then(response => {
                    if (!response.ok) throw new Error('Network query track mapping error encountered.');
                    return response.json();
                })
                .then(res => {
                    // FIX: Pass the underlying array payload 'res.data' to the renderer
                    renderCandidateCards(res.data);
                })
                .catch(error => {
                    console.error('API Candidate Search Log Track Error:', error);
                    flashStatusAlert('Unable to pull active listings from the service environment layers smoothly.', 'error');
                });
        }

        function renderCandidateCards(candidatesList) {
            const resultsWrapper = document.getElementById('candidateResultsWrapper');
            const countBadge = document.getElementById('visibleCount');

            if (!candidatesList || candidatesList.length === 0) {
                countBadge.textContent = "0";
                resultsWrapper.innerHTML = `
        <div class="empty-results-box">
            <i class="fas fa-folder-open"></i>
            <p>No active talent profiles matching these structural filter configurations were found.</p>
        </div>
    `;
                return;
            }

            countBadge.textContent = candidatesList.length;
            let htmlCardsBuffer = "";

            candidatesList.forEach(candidate => {
                // Setup dynamic clean string splits mapping for array tags parsing layouts
                let skillsArr = [];
                if (candidate.skillsSummary) {
                    skillsArr = candidate.skillsSummary.split(',').map(s => s.trim()).filter(s => s.length > 0);
                } else if (candidate.skills) {
                    skillsArr = typeof candidate.skills === 'string' ? candidate.skills.split(',') : candidate.skills;
                }

                const tagsHtml = skillsArr.map(skill => `<span class="skill-tag">${escapeHtml(skill)}</span>`).join('');

                // Configure availability layout styles dynamically
                const isImmediate = (candidate.noticePeriod || '').toLowerCase().includes('immediate');
                const badgeClass = isImmediate ? 'badge-immediate' : 'badge-days';
                const badgeLabel = candidate.noticePeriod ? candidate.noticePeriod : 'Standard Notice';

                // FIX: Extract file name from Firebase URL or fallback cleanly
                const resumeFileName = candidate.resumeFileName || '#';
                let displayFileName = 'Resume_Document.pdf';
                if (candidate.resumeUrl) {
                    const urlParts = candidate.resumeUrl.split('/');
                    const encodedName = urlParts[urlParts.length - 1].split('?')[0];
                    displayFileName = decodeURIComponent(encodedName).split('_').pop() || 'Download_Resume.pdf';
                }

                htmlCardsBuffer += `
        <div class="candidate-card">
            <div class="card-top">
                <div>
                    <h3 class="candidate-name">${escapeHtml(candidate.fullName || candidate.name || 'Verified Applicant')}</h3>
                    <div class="candidate-meta">
                        <span><i class="fas fa-graduation-cap"></i> ${escapeHtml(candidate.qualification || 'Not Specified')}</span>
                        <span><i class="fas fa-briefcase"></i> ${escapeHtml(candidate.experience || 'Fresher')}</span>
                        <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(candidate.city || 'India')}</span>
                    </div>
                </div>
                <span class="badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>
            </div>
            <div class="skills-container">
                ${tagsHtml || '<span class="skill-tag">General Industry Competencies</span>'}
            </div>
            <p class="candidate-summary">${escapeHtml(candidate.skillsSummary || 'Professional track candidate profile optimized for enterprise placement parameters.')}</p>

            <button class="download-resume-btn" onclick="triggerDownload('${escapeHtml(resumeFileName)}')">
                <i class="fas fa-file-download"></i> Extract Profile Document (${escapeHtml(displayFileName)})
            </button>
        </div>
    `;
            });

            resultsWrapper.innerHTML = htmlCardsBuffer;
        }


        function resetFilters() {
            document.getElementById('filterForm').reset();

            // Fully reset result section display parameters to native hidden status
            const resultsSection = document.getElementById('resultsSection');
            const resultsWrapper = document.getElementById('candidateResultsWrapper');

            resultsSection.style.display = 'none';
            resultsWrapper.innerHTML = '';
            document.getElementById('visibleCount').textContent = "0";

            flashStatusAlert("Search criteria matrices cleared. Reverted to complete active talent registry.", "success");
        }

        function triggerDownload(fileName) {
            try {
                let encodedFileName = encodeURIComponent(fileName);
                flashStatusAlert("Opening applicant profile stream...", "success");
                const backendDownloadUrl = `/api/job-portal/download/${encodedFileName}`;
                window.open(backendDownloadUrl, '_blank');
            } catch (error) {
                console.error("Download failed:", error);
                flashStatusAlert("An error occurred while trying to fetch the file.", "error");
            }
        }

        function flashStatusAlert(message, statusType = "success") {
            const alertBox = document.getElementById('statusAlert');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            alertBox.className = `status-notification status-${statusType}`;
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

    </script>

</body>

</html>
