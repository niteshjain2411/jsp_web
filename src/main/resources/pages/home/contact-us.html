<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Jain Sangh Pune</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --primary-color: #8B0000; /* Deep burgundy accent */
            --secondary-color: #D4AF37; /* Warm gold accent */
            --text-dark: #2A2A2A;
            --text-muted: #666666;
            --bg-light: #F9F9F9;
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        /* Hero Banner Section with Professional Jain Temple Background */
        .hero-banner {
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)),
                        url('../images/jain-temple-background.png') center/cover no-repeat;
            color: var(--text-dark);
            text-align: center;
            padding: 100px 20px;
        }

        .hero-banner h1 {
            font-size: 2.8rem;
            margin: 0 0 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary-color);
        }

        .hero-banner p {
            font-size: 1.2rem;
            margin: 0;
            color: #444444;
            max-width: 700px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Main Container */
        .contact-container {
            max-width: 1200px;
            margin: -40px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Grid Layout */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 850px) {
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards Styling */
        .info-card, .form-card {
            background: var(--white);
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Detail Items */
        .detail-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-icon {
            background-color: rgba(139, 0, 0, 0.08);
            color: var(--primary-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .detail-content h3 {
            margin: 0 0 5px;
            font-size: 1.05rem;
            color: var(--text-dark);
        }

        .detail-content p, .detail-content a {
            margin: 0;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .detail-content a:hover {
            color: var(--primary-color);
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #6B0000;
        }

        /* Map Embed Container */
        .map-section {
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: var(--white);
        }

        .map-section iframe {
            width: 100%;
            height: 350px;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<!-- Hero Banner -->
<section class="hero-banner">
    <h1>Contact Us</h1>
    <p style="font-style: italic;">"जुड़ कर देखो, अच्छा लगता है"</p>
</section>

<!-- Main Contact Section -->
<main class="contact-container">
    <div class="contact-grid">

        <!-- Office Details Card -->
        <div class="info-card">
            <h2 class="card-title">Registered Office</h2>

            <div class="detail-item">
                <div class="detail-icon">📍</div>
                <div class="detail-content">
                    <h3>Address</h3>
                    <p>B112, Gyanoday Digambar Jain Society,<br>
                        Bhagawan Neminath Chowk, Sus,<br>
                        Pune - 411021, Maharashtra, India</p>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">📞</div>
                <div class="detail-content">
                    <h3>Phone</h3>
                    <p><a href="tel:+918799928256">+91 87999 28256</a></p>
                </div>
            </div>

            <div class="detail-item">
                <div class="detail-icon">✉️</div>
                <div class="detail-content">
                    <h3>Email</h3>
                    <p><a href="mailto:jainsanghpune@gmail.com">jainsanghpune@gmail.com</a></p>
                </div>
            </div>
        </div>

        <!-- Contact Form Card -->
        <div class="form-card">
            <h2 class="card-title">Send Us a Message</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Your Full Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 XXXXX XXXXX">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-control" placeholder="How can we help you?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit Enquiry</button>
            </form>
        </div>

    </div>

    <!-- Google Map Location Embed -->
    <div class="map-section">
        <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3782.261271638848!2d73.7460298!3d18.5622695!2m3!10f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bec70409a80b%3A0xe54e20ef9cf26938!2sSus%2C%20Pune%2C%20Maharashtra%20411021!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="../header-loader.js"></script>
<script src="../footer-loader.js"></script>
</body>
</html>
