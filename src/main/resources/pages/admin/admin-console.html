<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jain Sangh Pune - Admin Console</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Check if the login flag exists in session storage
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            // If not logged in, alert the user and boot them back to login page
            alert("Access Denied! Please login first.");
            window.location.href = "login.html";
        }

        function logoutUser() {
            // Clear the specific login flag
            sessionStorage.removeItem("isLoggedIn");
            // Send them back to the login page
            window.location.href = "login.html";
        }

        // Function to switch between dashboard views smoothly
        function switchView(viewType, url = '', title = 'Dashboard Overview') {
            const dashboardView = document.getElementById('dashboard-view');
            const pageFrame = document.getElementById('page-frame');
            const pageTitle = document.getElementById('page-title');

            // Dynamic title updater
            if (pageTitle) pageTitle.textContent = title;

            // Reset navigation link styles
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-amber-600', 'text-white', 'font-medium');
                link.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
            });

            // Set active navigation style
            const activeLink = document.getElementById(`nav-${viewType}`);
            if (activeLink) {
                activeLink.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                activeLink.classList.add('bg-amber-600', 'text-white', 'font-medium');
            }

            // Toggle view visibility
            if (viewType === 'dashboard') {
                dashboardView.classList.remove('hidden');
                pageFrame.classList.add('hidden');
                pageFrame.src = '';
            } else {
                dashboardView.classList.add('hidden');
                pageFrame.classList.remove('hidden');
                pageFrame.src = url;
            }
        }
    </script>
</head>

<body class="bg-gray-100 font-sans antialiased">

<div class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
        <div class="p-5 text-xl font-bold border-b border-slate-800 flex items-center gap-3">
            <i class="fa-solid fa-user-shield text-amber-500"></i>
            <span>JSP Admin</span>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="javascript:void(0)" id="nav-volunteers" onclick="switchView('volunteers', 'registration_data.html', 'Volunteer Registration Data')"
               class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-users w-5"></i>Volunteers
            </a>
            <a href="javascript:void(0)" id="nav-requests" onclick="switchView('requests', '../service_request/service-requests.html', 'Open Service Requests')"
               class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <i class="fas fa-hands-helping" style="color: #bae6fd;"></i>Open Requests
            </a>
            <a href="javascript:void(0)" id="nav-job-requests" onclick="switchView('job-requests', '../job-portal/job-recruiter.html', 'Open Job applications')"
               class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-paper-plane"></i>Job Requests
            </a>
            <!-- Added News and Events option here -->
            <a href="javascript:void(0)" id="nav-news-events" onclick="switchView('news-events', 'news-event-form.html', 'Add News & Events')"
               class="nav-link flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-newspaper"></i>News & Events
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 text-sm text-slate-400 flex items-center justify-between">
            <div>
                <p class="font-semibold text-white">Admin User</p>
                <p class="text-xs">trustee@jsp.com</p>
            </div>
            <a href="#" class="text-slate-400 hover:text-red-400 transition" title="Logout" onclick="logoutUser()">
                <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">

        <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-600 text-xl hover:text-slate-900">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 id="page-title" class="text-xl font-bold text-slate-800">Console Overview</h1>
            </div>
        </header>

        <div id="dashboard-view" class="flex-1 p-6 space-y-6 overflow-y-auto">
            <!-- Hardcoded metrics cards and recent updates table have been cleared out -->
            <div class="text-center py-20 text-slate-500">
                <i class="fa-solid fa-folder-open text-4xl mb-3 block"></i>
                <p class="text-lg font-medium">Select a module from the sidebar to view metrics or management data.</p>
            </div>
        </div>

        <!-- iframe uses full-width and layout flex tracking -->
        <iframe id="page-frame" class="w-full flex-1 border-none hidden"></iframe>

    </main>
</div>
</body>
</html>
