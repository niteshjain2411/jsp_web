<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jain Sangh Pune | Admin Login</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .login-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #34495e;
        }
    </style>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const message = document.getElementById('message');

            if (user === 'jsp' && pass === 'jsp') {
                message.style.color = 'green';
                message.textContent = 'Login Successful! Redirecting...';
                sessionStorage.setItem("isLoggedIn", "true");
                // Redirect to your admin dashboard
                window.location.href = 'admin-console.html';
            } else {
                message.style.color = 'red';
                message.textContent = 'Invalid username or password.';
            }
        });
    </script>
</head>

<body>
    <div class="login-container">
        <h2>Admin Console</h2>
        <form id="loginForm">
            <label for="username"></label><input type="text" id="username" placeholder="Username" required>
            <label for="password"></label><input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
