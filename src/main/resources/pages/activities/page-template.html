<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title | Jain Sangh Pune</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --primary-color: #2a7d8c;
            --secondary-color: #f4b41a;
            --text-dark: #333;
            --light-bg: #fdfdfd;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            background-color: #fff;
        }

        /* Add your page-specific styles here */

        /* Footer styles (copy from main page or create your own) */
        footer {
            background: #222;
            color: #bbb;
            padding: 40px 5% 20px;
            font-size: 0.9rem;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }
        .footer-bottom {
            border-top: 1px solid #333;
            margin-top: 30px;
            padding-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Header will be loaded here by the JavaScript -->
<div id="header-placeholder"></div>

<!-- Your page content goes here -->
<main>
    <h1>Your Page Content</h1>
    <p>This is where your page-specific content goes.</p>
</main>

<!-- Footer will be loaded here by the JavaScript -->
<div id="footer-placeholder"></div>

<!-- Load the shared header and footer -->
<script src="../header-loader.js"></script>
<script src="../footer-loader.js"></script>

</body>
</html>
