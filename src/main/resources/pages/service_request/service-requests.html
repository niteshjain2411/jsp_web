<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Requests Console | JSP</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght=400;500;600;700&family=Open+Sans:wght=400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Shared CSS Palette synchronized from job-recruiter template */
        :root {
            --primary-blue: #0284c7;
            --secondary-blue: #0369a1;
            --dark-navy: #0f172a;
            --accent-cyan: #06b6d4;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --light-bg: #f0f9ff;
            --card-shadow: 0 10px 30px rgba(2, 132, 199, 0.08);
            --border-color: #cbd5e1;
            --focus-ring: rgba(2, 132, 199, 0.2);
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --warning-amber: #f59e0b;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #f0f9ff;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .content {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            flex: 1;
            width: 100%;
        }

        .main-card {
            background: #ffffff;
            border-radius: 0;
            box-shadow: none;
            border: none;
            overflow: hidden;
            width: 100%;
        }

        .card-body-padding {
            padding: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        #resultsSection {
            animation: fadeIn 0.4s ease-out;
            width: 100%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 15px 0;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 10px;
            width: 100%;
        }

        .results-count {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .results-count strong {
            color: var(--secondary-blue);
        }

        /* Refresh Button Styles */
        .refresh-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            padding: 6px 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background: var(--light-bg);
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .refresh-btn i {
            font-size: 11px;
            transition: transform 0.4s ease;
        }

        .refresh-btn:active i {
            transform: rotate(180deg);
        }

        .request-cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .request-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            transition: all 0.25s ease;
            position: relative;
            animation: slideUp 0.4s ease-out both;
            width: 100%;
            box-sizing: border-box;
        }

        .request-card:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.05);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            width: 100%;
        }

        .applicant-name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: var(--dark-navy);
            margin: 0 0 4px 0;
        }

        .request-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            width: 100%;
        }

        .request-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .request-meta i {
            color: var(--primary-blue);
        }

        .badge-container {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-income {
            background-color: #f0f9ff;
            color: var(--secondary-blue);
            border: 1px solid #bae6fd;
            white-space: nowrap;
        }

        .badge-status {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .badge-status.approved {
            background-color: #dcfce7;
            color: #166534;
            border-color: #bbf7d0;
        }

        .badge-status.pending {
            background-color: #fef3c7;
            color: #92400e;
            border-color: #fde68a;
        }

        .badge-status.rejected {
            background-color: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        /* Compact info blocks flex layout */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .info-block-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--secondary-blue);
            margin: 8px 0 3px 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        /* Target the Registered Family Members heading directly below the help details grid */
        .info-grid+.info-block-title {
            margin-top: -5px;
            /* Adjusted gap to tighten space above family members */
        }

        .details-box {
            font-size: 12.5px;
            color: #475569;
            margin: 0 0 5px 0;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #cbd5e1;
            width: 100%;
            box-sizing: border-box;
        }

        .family-display-table {
            width: 100%;
            border-collapse: collapse;
            margin: 4px 0 8px 0;
            font-size: 12px;
        }

        .family-display-table th,
        .family-display-table td {
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            text-align: left;
        }

        .family-display-table th {
            background-color: var(--light-bg);
            color: var(--secondary-blue);
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        .card-footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Update Flow Form Layout styles */
        .action-update-form {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 280px;
            flex-wrap: wrap;
            /* Allows textarea to break to the next line */
        }

        .badge-id-static {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
            font-size: 11px;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .update-select {
            padding: 5px 8px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-dark);
            background: #ffffff;
            outline: none;
        }

        .update-select:focus {
            border-color: var(--primary-blue);
        }

        .update-remark {
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            flex: 1 1 100%;
            /* Spans full width to push down to the next line */
            outline: none;
            resize: vertical;
            min-height: 42px;
            font-family: 'Open Sans', sans-serif;
            box-sizing: border-box;
            margin-top: 4px;
        }

        .update-remark:focus {
            border-color: var(--primary-blue);
        }

        .submit-update-btn {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s ease;
        }

        .submit-update-btn:hover {
            background: var(--secondary-blue);
        }

        .download-docs-btn {
            background: none;
            border: 1px solid var(--primary-blue);
            color: var(--primary-blue);
            padding: 5px 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .download-docs-btn:hover {
            background: var(--primary-blue);
            color: #ffffff;
        }

        .status-notification {
            display: none;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .status-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
        }

        .status-success {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .empty-results-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            background: #f8fafc;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .empty-results-box i {
            font-size: 32px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        /* Record Separator Line */
        .record-separator {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, rgba(2, 132, 199, 0), rgba(2, 132, 199, 0.4), rgba(2, 132, 199, 0));
            margin: 20px 0;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="content" style="width: 100%; padding: 12px; box-sizing: border-box; align-self: center;">
        <div id="statusAlert" class="status-notification"></div>
        <div class="main-card">
            <div class="card-body-padding">
                <div id="resultsSection">
                    <div class="results-header">
                        <div class="results-count">Total Collected Profiles: <strong id="visibleCount">0</strong>
                            incoming records</div>
                        <div>
                            <button class="refresh-btn" onclick="loadAllServiceRequests()">
                                <i class="fas fa-sync-alt"></i> Refresh Records
                            </button>
                        </div>
                    </div>

                    <div id="requestResultsWrapper" class="request-cards-container">
                        <div class="empty-results-box">
                            <i class="fas fa-spinner fa-spin" style="color: var(--primary-blue);"></i>
                            <p>Loading application registries from server streams...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadAllServiceRequests();
        });

        function loadAllServiceRequests() {
            const resultsWrapper = document.getElementById('requestResultsWrapper');

            // Show active loading state when layout refreshes manually
            resultsWrapper.innerHTML = `
            <div class="empty-results-box">
                <i class="fas fa-spinner fa-spin" style="color: var(--primary-blue);"></i>
                <p>Loading application registries from server streams...</p>
            </div>
        `;

            const requestUrl = window.location.pathname.includes('/jainsanghpune/') ?
                '/jainsanghpune/api/service-request/all' : '/api/service-request/all';

            fetch(requestUrl, {
                method: 'GET',
                headers: { 'Accept': 'application/json' }
            })
                .then(response => {
                    if (!response.ok) throw new Error('Data endpoint failure response sequence maps.');
                    return response.json();
                })
                .then(res => {
                    const finalRecordsList = Array.isArray(res) ? res : (res.data || []);
                    renderRequestCards(finalRecordsList);
                })
                .catch(error => {
                    console.error('API Pull Error Exception:', error);
                    flashStatusAlert('Could not aggregate service data maps smoothly.', 'error');
                    resultsWrapper.innerHTML = `
            <div class="empty-results-box">
                <i class="fas fa-exclamation-triangle" style="color: var(--danger-red);"></i>
                <p>Error tracking service record collections packages.</p>
            </div>
        `;
                });
        }

        function renderRequestCards(requests) {
            const resultsWrapper = document.getElementById('requestResultsWrapper');
            const countBadge = document.getElementById('visibleCount');

            if (!requests || requests.length === 0) {
                countBadge.textContent = "0";
                resultsWrapper.innerHTML = `
            <div class="empty-results-box">
                <i class="fas fa-folder-open"></i>
                <p>No active service request profiles are currently available.</p>
            </div>
        `;
                return;
            }

            countBadge.textContent = requests.length;
            let htmlBuffer = "";

            requests.forEach((req, index) => {
                const incomeMetric = req.monthlyIncome ? `₹${req.monthlyIncome} / mo` : 'Not Declared';
                const fileDownloadLinkName = req.documentFileName || 'Verified_Envelope.pdf';
                const currentRemarks = req.remarks || '';
                const recordIdString = req.id ? req.id.toString() : 'N/A';

                // Status calculations
                const statusText = req.status || 'Pending';
                let statusClass = 'pending';
                if (statusText.toLowerCase() === 'approved' || statusText.toLowerCase() === 'active') statusClass = 'approved';
                if (statusText.toLowerCase() === 'rejected' || statusText.toLowerCase() === 'declined') statusClass = 'rejected';

                let familyRowsHtml = '';
                if (req.familyMembers && req.familyMembers.length > 0) {
                    req.familyMembers.forEach(member => {
                        familyRowsHtml += `
                    <tr>
                        <td>${escapeHtml(member.name || 'N/A')}</td>
                        <td>${escapeHtml(member.age || 'N/A')}</td>
                        <td>${escapeHtml(member.relation || 'N/A')}</td>
                        <td>${escapeHtml(member.occupation || 'N/A')}</td>
                    </tr>
                `;
                    });
                } else {
                    familyRowsHtml = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 4px;">No registered family entries.</td></tr>`;
                }

                htmlBuffer += `
            <div class="request-card" id="card-${recordIdString}">
                <div class="card-top">
                    <div>
                        <h3 class="applicant-name">${escapeHtml(req.fullName || 'Anonymous Beneficiary')}</h3>
                        <div class="request-meta">
                            <span><i class="fas fa-phone-alt"></i> ${escapeHtml(req.phone || 'N/A')}</span>
                            <span><i class="fas fa-calendar-alt"></i> DOB: ${escapeHtml(req.dob || 'N/A')} (${escapeHtml(req.gender || 'Unspecified')})</span>
                            <span><i class="fas fa-briefcase"></i> Occup: ${escapeHtml(req.occupation || 'N/A')}</span>
                            <span><i class="fas fa-id-card"></i> PAN: ${escapeHtml(req.panNumber || 'N/A')}</span>
                        </div>
                    </div>
                    <div class="badge-container">
                        <span class="badge badge-status ${statusClass}">Status: ${escapeHtml(statusText)}</span>
                        <span class="badge badge-income">Income: ${escapeHtml(incomeMetric)}</span>
                    </div>
                </div>

                <div class="request-meta" style="margin-bottom: 6px; font-size: 12px; color: #475569;">
                    <span><i class="fas fa-user-friends"></i> <strong>Father/Husband Name:</strong> ${escapeHtml(req.fatherName || 'N/A')}</span>
                    <span><i class="fas fa-history"></i> <strong>Applied Before:</strong> ${escapeHtml(req.appliedBefore || 'No')}</span>
                </div>
                <div class="request-meta" style="margin-bottom: 6px; font-size: 12px; color: #475569;">
                    <span><i class="fas fa-map-marker-alt"></i> <strong>Address:</strong> ${escapeHtml(req.address || 'No location metric verified.')}</span>
                </div>

                <div class="info-grid">
                    <div>
                        <div class="info-block-title"><i class="fas fa-hand-holding-heart"></i> Required Help Details</div>
                        <p class="details-box">${escapeHtml(req.helpWanted || 'No parameters explicit layout declarations provided.')}</p>
                    </div>
                    <div>
                        <div class="info-block-title"><i class="fas fa-chart-line"></i> Post-Support Implementation Plan</div>
                        <p class="details-box">${escapeHtml(req.afterHelpPlan || 'No subsequent target blueprint provided.')}</p>
                    </div>
                </div>

                <div class="info-block-title"><i class="fas fa-users"></i> Registered Family Members</div>
                <table class="family-display-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Relation</th>
                            <th>Occupation</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${familyRowsHtml}
                    </tbody>
                </table>
                <div>
                 <button class="download-docs-btn" onclick="triggerDocumentExtraction('${escapeHtml(fileDownloadLinkName)}')">
                        <i class="fas fa-file-download"></i> Download Doc
                  </button>
                </div>
                <div class="card-footer-actions">
                    <div class="action-update-form">
                        <span class="badge-id-static">ID: #${escapeHtml(recordIdString)}</span>
                        <select class="update-select" id="status-select-${recordIdString}">
                            <option value="Pending" ${statusText.toLowerCase() === 'pending' ? 'selected' : ''}>⏳ Pending Review</option>
                            <option value="Under verification" ${statusText.toLowerCase() === 'under verification' ? 'selected' : ''}>🔍 Under Verification</option>
                            <option value="Verification completed" ${statusText.toLowerCase() === 'verification completed' ? 'selected' : ''}>✅ Verification Completed</option>
                            <option value="Approved" ${statusText.toLowerCase() === 'approved' || statusText.toLowerCase() === 'active' ? 'selected' : ''}>💚 Approved & Active</option>
                            <option value="Rejected" ${statusText.toLowerCase() === 'rejected' || statusText.toLowerCase() === 'declined' ? 'selected' : ''}>❌ Rejected / Declined</option>
                            <option value="Closed" ${statusText.toLowerCase() === 'closed' ? 'selected' : ''}>🔒 Closed</option>
                        </select>
                        <textarea class="update-remark" id="remark-input-${recordIdString}" placeholder="Enter processing remarks..." rows="2">${escapeHtml(currentRemarks)}</textarea>
                        <button class="submit-update-btn" style="margin-right: auto; margin-top: 5px;" onclick="submitStatusUpdate('${recordIdString}')">Update</button>
                    </div>
                </div>
            </div>
            `;

                // If it is not the last record, append a visual separator
                if (index < requests.length - 1) {
                    htmlBuffer += `<div class="record-separator"></div>`;
                }
            });

            resultsWrapper.innerHTML = htmlBuffer;
        }

        function submitStatusUpdate(requestId) {
            if (!requestId || requestId === 'N/A') return;
            const selectedStatus = document.getElementById(`status-select-${requestId}`).value;
            const inputRemark = document.getElementById(`remark-input-${requestId}`).value;

            const baseUrl = window.location.pathname.includes('/jainsanghpune/') ? '/jainsanghpune' : '';
            const updateUrl = `${baseUrl}/api/service-request/update/${requestId}`;

            // Create URL-encoded form parameters to match @RequestParam in backend
            const formParams = new URLSearchParams();
            formParams.append('status', selectedStatus);
            formParams.append('remarks', inputRemark);

            fetch(updateUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'Accept': 'application/json'
                },
                body: formParams
            })
                .then(response => {
                    if (!response.ok) throw new Error('Failed updating parameters.');
                    return response.json();
                })
                .then(res => {
                    flashStatusAlert("Status and remarks updated successfully!", "success");
                    loadAllServiceRequests();
                })
                .catch(error => {
                    console.error('Update Error:', error);
                    flashStatusAlert('Could not sync status change updates upstream.', 'error');
                });
        }

        function triggerDocumentExtraction(fileName) {
            try {
                let encodedFileName = encodeURIComponent(fileName);
                flashStatusAlert("Opening active verification attachment payload data streams...", "success");
                const backendDownloadUrl = `/api/service-request/download/${encodedFileName}`;
                window.open(backendDownloadUrl, '_blank');
            } catch (error) {
                console.error("Document collection error:", error);
                flashStatusAlert("An operational tracking error occurred while pulling documentation logs.", "error");
            }
        }

        function flashStatusAlert(message, statusType = "success") {
            const alertBox = document.getElementById('statusAlert');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            alertBox.className = `status-notification status-${statusType}`;
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>

</html>
