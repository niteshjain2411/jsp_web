<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Jain Sangh Pune</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #1e3a8a;      /* Deep Royal Blue */
            --primary-glow: #3b82f6;      /* Vibrant Accent Blue */
            --accent-teal: #0d9488;       /* Sophisticated Teal */
            --alert-amber: #d97706;       /* Warm Construction Amber */
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --light-bg: #f0f4f8;
            --border-color: #e2e8f0;
            --shadow-premium: 0 15px 35px rgba(30, 58, 138, 0.08);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Background Shapes */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: 1;
            opacity: 0.3;
        }
        body::before {
            width: 350px;
            height: 350px;
            background: var(--primary-blue);
            top: -100px;
            left: -100px;
            filter: blur(90px);
        }
        body::after {
            width: 450px;
            height: 450px;
            background: var(--accent-teal);
            bottom: -150px;
            right: -150px;
            filter: blur(110px);
        }

        .construction-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-premium);
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-sizing: border-box;
        }

        /* Top Brand Border Accent */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, var(--primary-blue), var(--accent-teal), var(--alert-amber));
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: rgba(30, 58, 138, 0.06);
            color: var(--primary-blue);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin-bottom: 25px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.2); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(30, 58, 138, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: var(--primary-blue);
            font-size: 2rem;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-teal);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 auto 30px auto;
            max-width: 440px;
        }

        /* Progress Bar Section */
        .progress-container {
            margin-bottom: 35px;
            text-align: left;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: rgba(30, 58, 138, 0.08);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 75%; /* Set your site progress percentage here */
            background: linear-gradient(to right, var(--primary-blue), var(--primary-glow));
            border-radius: 4px;
            position: relative;
            animation: progressLoad 1.5s ease-out forwards;
        }

        @keyframes progressLoad {
            from { width: 0%; }
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
        }

        .btn-primary:hover {
            background-color: var(--primary-glow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.25);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-blue);
            border: 1px solid rgba(30, 58, 138, 0.3);
        }

        .btn-secondary:hover {
            background-color: rgba(30, 58, 138, 0.04);
            border-color: var(--primary-blue);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .construction-container {
                padding: 40px 20px;
            }
            h1 { font-size: 1.6rem; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="construction-container">
    <div class="top-bar"></div>

    <div class="icon-wrapper">
        <i class="fas fa-drafting-compass"></i>
    </div>

    <h1>JAIN SANGH PUNE</h1>
    <span class="header-tagline">जुड़ कर देखो, अच्छा लगता है </span>

    <div style="padding: 20px 0;">
        <p>This page is currently under construction. We are working hard to bring you an upgraded, seamless digital
            experience. Please check back soon!</p>
    </div>
    <div class="progress-container">
        <div class="progress-label">
            <span>Development Progress</span>
            <span>75%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="btn-group">
        <a href="/pages/home.html" class="btn btn-primary">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="/pages/activities/donate-now.html" class="btn btn-secondary">
            <i class="fas fa-heart"></i> Donate Now
        </a>
    </div>
</div>

</body>
</html>
